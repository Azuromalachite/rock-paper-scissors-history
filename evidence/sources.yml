# Sources behind the notes.
#
# access: the deepest level anyone has reached for this source, ordered:
#   primary_inspected  the passage itself was read
#   indexed_text       a search-engine or database text of it was read, not the original
#   catalogue_record   only a library / publisher record (establishes existence, date, author)
#   secondary_report   only someone else's description of it
#   user_screenshot    a private screenshot the owner holds; not in this repository
#   not_located        cited by description only; nobody has identified the exact item
#
# by / when: who reached that level, and when. "ai_assisted_search, before
# 2026-11-06" means the single compilation pass, not an independent re-check
# (OF-2).
#
# url, archived, accessed, locator: what someone else needs to re-find the
# passage. null means not recorded (OF-1), never "not applicable".

